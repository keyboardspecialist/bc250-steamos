name: Repair v0.27.13 release notes

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    name: Restore annotated release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore release notes from annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.27.13
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          gh release edit "$RELEASE_TAG" \
            --notes "$(git tag --list "$RELEASE_TAG" --format='%(contents)')"
