name: Build BC250 Trainer prerelease

on:
  push:
    tags:
      - "trainer-v*"

permissions:
  contents: write

concurrency:
  group: trainer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish BC250 Trainer
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
      ARTIFACT_BASENAME: bc250-${{ github.ref_name }}

    steps:
      - name: Check out BC250 Trainer tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${TAG_NAME#trainer-v}
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use trainer-vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          git fetch --force --tags origin
          if [[ "$(git cat-file -t "refs/tags/$TAG_NAME")" != "tag" ]]; then
            echo "$TAG_NAME must be an annotated tag." >&2
            exit 1
          fi
          git fetch origin \
            '+refs/heads/master:refs/remotes/origin/master'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "BC250 Trainer release tags must point to commits on master." >&2
            exit 1
          fi
          if grep -q '^Do not publish either asset in a release' trainer/ASSETS.md; then
            echo "BC250 Trainer asset redistribution is not yet cleared; see trainer/ASSETS.md." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: decky-plugin/pnpm-lock.yaml

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acpica-tools cpio cmake ninja-build g++ flatpak flatpak-builder \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qt6-tools-dev-tools \
            qml6-module-qt-labs-settings qml6-module-qtmultimedia \
            qml6-module-qtqml-workerscript \
            qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qttest \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio

      - name: Build Decky test fixture
        working-directory: decky-plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Configure BC250 Trainer
        run: |
          cmake -S trainer -B build/trainer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTRAINER_PROJECT_VERSION="$VERSION"

      - name: Build BC250 Trainer
        run: cmake --build build/trainer --parallel

      - name: Run BC250 Trainer tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ctest --test-dir build/trainer --output-on-failure
          cmake --build build/trainer --target qml-lint
          QT_MEDIA_BACKEND=mock build/trainer/bc250-trainer --mock --smoke-test

      - name: Run service and release tests
        run: |
          PYTHONPATH=backend:backend/vendor \
            python3 -m unittest discover -s backend/tests
          PYTHONPATH=desktop-control/service:desktop-control/vendor:backend:backend/vendor \
            python3 -m unittest discover -s desktop-control/service/tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_qml_utils.cjs

      - name: Package BC250 Trainer
        run: |
          python3 scripts/stage-trainer-runtime.py \
            --binary build/trainer/bc250-trainer \
            --output release/bc250-trainer \
            --archive "${ARTIFACT_BASENAME}.zip" \
            --sha256 "${ARTIFACT_BASENAME}.zip.sha256"

      - name: Build BC250 Trainer Flatpak
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          TRAINER_PROJECT_VERSION="$VERSION" \
            flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo flatpak-build \
            trainer/packaging/io.github.keyboardspecialist.bc250trainer.yml
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "${ARTIFACT_BASENAME}.flatpak" \
            io.github.keyboardspecialist.bc250trainer stable
          python3 scripts/stage-trainer-runtime.py \
            --flatpak "${ARTIFACT_BASENAME}.flatpak" \
            --output release/bc250-trainer-flatpak-installer \
            --archive "${ARTIFACT_BASENAME}-flatpak-installer.zip" \
            --sha256 "${ARTIFACT_BASENAME}-flatpak-installer.zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            ${{ env.ARTIFACT_BASENAME }}.zip
            ${{ env.ARTIFACT_BASENAME }}.zip.sha256
            ${{ env.ARTIFACT_BASENAME }}-flatpak-installer.zip
            ${{ env.ARTIFACT_BASENAME }}-flatpak-installer.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Prepare BC250 Trainer release notes
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git tag --list 'trainer-v*' --merged "$GITHUB_SHA" \
            --sort=-version:refname \
            | awk -v current="$TAG_NAME" '$0 != current { print; exit }')
          if [[ -n "$previous" ]]; then
            range="$previous..$GITHUB_SHA"
          else
            base=$(git merge-base origin/master "$GITHUB_SHA")
            range="$base..$GITHUB_SHA"
          fi
          {
            echo "BC250 Trainer branch prerelease built from \`$GITHUB_SHA\`."
            echo
            git log --no-merges --pretty='- %s (`%h`)' "$range"
          } > trainer-release-notes.md

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              "${ARTIFACT_BASENAME}.zip" \
              "${ARTIFACT_BASENAME}.zip.sha256" \
              "${ARTIFACT_BASENAME}-flatpak-installer.zip" \
              "${ARTIFACT_BASENAME}-flatpak-installer.zip.sha256" \
              --clobber
          else
            gh release create "$TAG_NAME" \
              "${ARTIFACT_BASENAME}.zip" \
              "${ARTIFACT_BASENAME}.zip.sha256" \
              "${ARTIFACT_BASENAME}-flatpak-installer.zip" \
              "${ARTIFACT_BASENAME}-flatpak-installer.zip.sha256" \
              --verify-tag \
              --prerelease \
              --title "BC250 Trainer v$VERSION" \
              --notes-file trainer-release-notes.md
          fi
