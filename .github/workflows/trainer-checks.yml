name: BC250 Trainer Linux checks

on:
  pull_request:
    paths:
      - "trainer/**"
      - "decky-plugin/**"
      - "backend/**"
      - "desktop-control/**"
      - "coolercontrol/**"
      - "core-unlock/**"
      - "scripts/**"
      - "menus/**"
      - "MENU-GRAPH.md"
      - "README.md"
      - "tests/**"
      - "acpi-tables/**"
      - "aic8800/*.sh"
      - "bc250-*.sh"
      - "bc250-mesa-patches/**"
      - "topology.sh"
      - ".github/workflows/trainer-checks.yml"
      - ".github/workflows/trainer-release.yml"
      - ".github/workflows/release-artifacts.yml"
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Node 24 actions require runner >=2.327.1 (provided by GitHub-hosted Ubuntu).
  python:
    name: Service tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Decky's compatibility baseline plus a supported CPython release.
        python: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run Python compatibility tests
        run: |
          PYTHONPATH=backend:backend/vendor \
            python3 -m unittest discover -s backend/tests
          PYTHONPATH=desktop-control/service:desktop-control/vendor:backend:backend/vendor \
            python3 -m unittest discover -s desktop-control/service/tests
          python3 -m unittest discover -s tests -p 'test_build_dependencies.py'

  linux:
    name: Native Linux build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: decky-plugin/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: decky-plugin/pnpm-lock.yaml

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acpica-tools cpio cmake ninja-build g++ clang lld file libarchive-tools \
            qt6-base-dev qt6-base-dev-tools \
            qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-multimedia-dev qt6-tools-dev-tools \
            qml6-module-qt-labs-settings qml6-module-qtmultimedia \
            qml6-module-qtqml-workerscript \
            qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qttest \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio

      - name: Build hardened EFI core unlock
        run: bash scripts/check-efi-core-unlock-build.sh

      - name: Build Decky test fixture
        working-directory: decky-plugin
        run: |
          pnpm --ignore-workspace install --frozen-lockfile
          pnpm --ignore-workspace run typecheck
          pnpm --ignore-workspace run build

      - name: Configure BC250 Trainer
        run: |
          cmake -S trainer -B build/trainer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build BC250 Trainer
        run: cmake --build build/trainer --parallel

      - name: Run BC250 Trainer tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ctest --test-dir build/trainer --output-on-failure
          cmake --build build/trainer --target qml-lint
          QT_MEDIA_BACKEND=mock build/trainer/bc250-trainer --mock --smoke-test

      - name: Run service and release tests
        run: |
          python3 scripts/generate-menus.py --check
          python3 scripts/analyze-menu-graph.py --check --depth-budget 3
          PYTHONPATH=backend:backend/vendor \
            python3 -m unittest discover -s backend/tests
          PYTHONPATH=desktop-control/service:desktop-control/vendor:backend:backend/vendor \
            python3 -m unittest discover -s desktop-control/service/tests
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/test_qml_utils.cjs
